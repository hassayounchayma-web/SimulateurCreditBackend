spring:
  application:
    name: CreditSimulatorApi

  datasource:
    url: jdbc:mysql://localhost:3306/credit_simulator_finale?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 96MB

app:
  jwt:
    # Ne jamais écrire la clé ici : la définir dans la variable d'environnement JWT_SECRET
    # (au moins 32 caractères). Sans elle, une clé aléatoire est générée à chaque démarrage.
    secret: ${JWT_SECRET:}
  dossier:
    storage-directory: ./data/dossiers
    checklist:
      # En attendant une confirmation officielle, ces règles restent inactives.
      expertise-seuil-montant: ${DOSSIER_EXPERTISE_SEUIL:}
      titre-recent-jours: ${DOSSIER_TITRE_RECENT_JOURS:}
      vehicule-date-reference: ${DOSSIER_VEHICULE_DATE_REFERENCE:}
      attestation-annuelle-obligatoire: ${DOSSIER_ATTESTATION_ANNUELLE_OBLIGATOIRE:false}
      attestation-travail-obligatoire: ${DOSSIER_ATTESTATION_TRAVAIL_OBLIGATOIRE:false}
  ocr:
    paddle:
      url: ${PADDLE_OCR_URL:http://localhost:8090/api/ocr/extract}

server:
  port: 8081

logging:
  level:
    tn.bna.simulateur: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
